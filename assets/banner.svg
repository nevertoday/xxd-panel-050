<svg width="1200" height="400" viewBox="0 0 1200 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <title>XXD Panel 050</title>
  <desc>Turn each source photograph into a bespoke airy-blue minimalist flat-vector travel scene with one recognisable focus, two to four meaningful contextual cues, calm whitespace, and integrated editorial copy.</desc>
  <defs><clipPath id="f"><rect width="1200" height="400" rx="30"/></clipPath><filter id="s" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="12"/></filter></defs>
