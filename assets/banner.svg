    <g transform="translate(58 42)"><rect width="224" height="34" rx="8" fill="#28404A"/><text x="16" y="22" fill="white" font-family="Arial,sans-serif" font-size="13" font-weight="900" letter-spacing="2">🦁 XXD / IMAGE SKILL</text><text y="112" fill="#28404A" font-family="Arial,sans-serif" font-size="68" font-weight="900" letter-spacing="-3">PANEL <tspan fill="#D5898C">050</tspan></text><text x="2" y="151" fill="#5F94A7" font-family="Arial,sans-serif" font-size="13" font-weight="900" letter-spacing=".22">BESPOKE TRAVEL SCENE · AIRY BLUE · FLAT VECTOR · QUIET EDITORIAL IDENTITY</text><text x="2" y="198" fill="#28404A" font-family="sans-serif" font-size="18" font-weight="800">让每张照片长成专属的空气蓝旅行视觉</text><text x="2" y="230" fill="#4C6872" font-family="sans-serif" font-size="14" font-weight="700">一枚の写真から、その場所だけの空色トラベル・ビジュアルへ</text><text x="2" y="260" fill="#4C6872" font-family="sans-serif" font-size="14" font-weight="700">한 장의 사진을 그 장소만의 에어리 블루 여행 비주얼로</text><text x="2" y="291" fill="#4C6872" font-family="Arial,sans-serif" font-size="13" font-weight="700">تحويل كل صورة إلى هوية سفر خاصة بلون أزرق هوائي هادئ</text></g>
